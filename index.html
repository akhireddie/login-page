<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.container {
    width: 22%;
    display: flex;
    justify-content: center;
    align-items: center;

}

.loginbox {
    width: 350px;   
     padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.loginbox h2 {
    text-align: center;
    margin-bottom: 10px;
}

.loginbox p {
    text-align: center;
    margin-bottom: 25px;
}

.input-box {
    margin-bottom: 20px;
}

.input-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid rgb(209, 203, 203);
    border-radius: 8px;
    font-size: 16px;
    transition: 0.3s;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    font-size: 14px;
}

button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    background: blue;
    transition: 0.3s;

}

.signup {
    margin-top: 20px;
    text-align: center;
    font-size: 14px;
}
</style>
</head>
<body>

<div class="container">
    <div class="loginbox">
        <h2>Login</h2>

        <form>
            <div class="input-box">
                <input type="email" placeholder="Email Address" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember Me
                </label>

                <a href="#">Forgot Password?</a>
            </div>

            <button type="submit">Login</button>

            <div class="signup">
                Don't have an account?
                <a href="#">Sign Up</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
